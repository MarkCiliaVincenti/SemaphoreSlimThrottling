name: .NET

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
            8.0.x
            9.0.x
            10.0.x
            11.0.100
        
    - name: Restore dependencies
      run: dotnet restore
      
    - name: Build
      run: dotnet build --no-restore --configuration Release

    - name: Test .NET 8.0
      run: dotnet test SemaphoreSlimThrottling.Tests\SemaphoreSlimThrottling.Tests.csproj --framework net8.0 --no-restore --configuration Release -- --coverage --coverage-output-format cobertura --coverage-output net8.0.cobertura.xml --results-directory coverage

    - name: Test .NET 9.0
      run: dotnet test SemaphoreSlimThrottling.Tests\SemaphoreSlimThrottling.Tests.csproj --framework net9.0 --no-restore --configuration Release -- --coverage --coverage-output-format cobertura --coverage-output net9.0.cobertura.xml --results-directory coverage

    - name: Test .NET 10.0
      run: dotnet test SemaphoreSlimThrottling.Tests\SemaphoreSlimThrottling.Tests.csproj --framework net10.0 --no-restore --configuration Release -- --coverage --coverage-output-format cobertura --coverage-output net10.0.cobertura.xml --results-directory coverage

    - name: Test .NET 11.0
      run: dotnet test SemaphoreSlimThrottling.Tests\SemaphoreSlimThrottling.Tests.csproj --framework net11.0 --no-restore --configuration Release -- --coverage --coverage-output-format cobertura --coverage-output net11.0.cobertura.xml --results-directory coverage

    - name: Code Coverage
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        directory: ${{ github.workspace }}\coverage
        files: ${{ github.workspace }}\coverage\net8.0.cobertura.xml,${{ github.workspace }}\coverage\net9.0.cobertura.xml,${{ github.workspace }}\coverage\net10.0.cobertura.xml,${{ github.workspace }}\coverage\net11.0.cobertura.xml
        disable_search: true
        fail_ci_if_error: true
